[package]
name = "sglang-processor"
description = "Shared SGLang wrappers over the Dynamo frontend crates"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["parser", "render", "tokenizer"]
parser = ["dep:dynamo-parsers", "dep:dynamo-protocols", "dep:regex", "dep:uuid"]
render = [
    "dep:dynamo-protocols",
    "dep:dynamo-renderer",
    "dep:minijinja",
    "dep:deepseek-recipe",
    "dep:deepseek-recipe-core",
    "dep:deepseek-recipe-encoding",
    "dep:tokenizers",
]
tokenizer = ["dep:dynamo-tokenizers"]
# OpenAI endpoints served through `/generate`.
openai = ["dep:regex", "dep:regex-syntax", "dep:uuid", "dep:sglang-api-types"]

[dependencies]
sglang-api-types = { version = "0.1.0", path = "../sglang-api-types", optional = true }
async-stream = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
# Prompt parity: SGLang serializes tool schemas in their request order, and
# parses floats correctly rounded, as Python's `json.loads` does.
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
thiserror = { workspace = true }
tracing = { workspace = true }

# DeepSeek-V4 / V4.1 prompts, as SGLang's Python server renders them.
deepseek-recipe = { version = "=0.2.0", optional = true }
deepseek-recipe-core = { version = "=0.2.0", optional = true }
deepseek-recipe-encoding = { version = "=0.2.0", optional = true }
# DeepSeek prompt ids as recipe encodes them; the version is recipe's.
tokenizers = { version = "0.23.2", default-features = false, optional = true }
dynamo-parsers = { version = "=9.2.8", optional = true }
dynamo-protocols = { version = "7.0.0", optional = true }
# dynamo-renderer 7.1.1 plus Kimi K3.1 detection (`model_type: kimi_k31` renders with the K3
# formatter), from datacrunch-research/frontend-crates `renderer/7.1.1-kimi-k31`, until
# ai-dynamo/frontend-crates#575 ships in a release this crate can move to.
dynamo-renderer = { git = "https://github.com/datacrunch-research/frontend-crates.git", tag = "dynamo-renderer-v7.1.1-verda.1", optional = true }
hf-hub = { version = "0.4", default-features = false }
regex = { version = "1", optional = true }
# Pinned as in sglang-server: what this parser accepts decides which tool
# schema `pattern`s lower (`re_compiles`); a bump can widen that silently.
regex-syntax = { version = "=0.8.11", optional = true }
uuid = { workspace = true, optional = true }
minijinja = { version = "2.24.0", features = ["unstable_machinery"], optional = true }

# Keep this paired with the server until Dynamo exposes a smaller tokenizer API.
# dynamo-tokenizers 4.0.0 (upstream frontend-crates main) with the Kimi reference cuts in tiktoken
# encodes, the heap merge path and the Kimi K3.1 (`kimi_k31`) pattern, from
# datacrunch-research/frontend-crates `tokenizers/kimi` (Venkat2811/frontend-crates
# `kimi-k3-latest-20261030` moved into the org fork). dynamo-renderer 7.1.1 still links 3.1.x: its
# encode segments are converted where they meet this tokenizer (sglang-server message/request.rs,
# tests/parity.rs).
dynamo-tokenizers = { git = "https://github.com/datacrunch-research/frontend-crates.git", tag = "dynamo-tokenizers-v4.0.0-verda.1", optional = true }

[dev-dependencies]
sha2 = "0.10"
